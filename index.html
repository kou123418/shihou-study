<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>司法試験マスター</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1220;color:#eef3ff;font:15px system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #303e57}h1{font-size:22px;margin:0}h2{margin-top:0}small,.muted{color:#a8b6ce}main{max-width:1240px;margin:auto;padding:22px}.layout{display:grid;grid-template-columns:240px 1fr;gap:20px}.panel{background:#151f32;border:1px solid #2e3b53;border-radius:15px;padding:20px;margin-bottom:18px}.nav,.topic{color:#eaf0ff;border:0;background:transparent;text-align:left;padding:11px;border-radius:9px;display:block;width:100%}.nav:hover,.nav.active,.topic:hover,.topic.active{background:#30486d}.topic{border:1px solid #34425a;background:#1c2b43}.topicgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px}.pill{border:1px solid #435777;background:#1b2b46;color:#f2f6ff;border-radius:9px;padding:9px 12px}.pill.primary{background:#426db2}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}label{display:block;margin:12px 0 5px}input,textarea,select{background:#0e1727;color:#fff;border:1px solid #4c5b77;border-radius:9px;padding:10px;width:100%}textarea{min-height:100px}.notice{border-left:3px solid #dcb96c;background:#2d2a2b;padding:12px;margin:14px 0}.gate{position:fixed;inset:0;background:#0a1020;z-index:99;display:grid;place-items:center;padding:20px}.gate>.panel{width:min(410px,100%)}.hidden{display:none!important}a{color:#a9cbff}.levels{display:grid;gap:8px}.level{border:1px solid #35445e;border-radius:10px;padding:12px}.level input{width:auto}.level label{margin:0 0 5px}.level p{margin:0;color:#a8b6ce;font-size:13px}@media(max-width:720px){.layout{grid-template-columns:1fr}main{padding:12px}.panel{padding:14px}}</style></head><body>
<div class="gate" id="gate"><div class="panel"><h1>⚖ 司法試験マスター</h1><p class="muted">暗証番号を入力してください</p><form id="auth"><input id="pin" type="password" inputmode="numeric" maxlength="4" required autocomplete="off" aria-label="暗証番号"><p id="error" class="muted"></p><button class="pill primary" type="submit">学習を開始</button></form><p><small>GitHub Pagesの公開ファイルを保護する本格的な認証ではありません。</small></p></div></div>
<header><div><h1>⚖ 司法試験マスター</h1><small>司法試験・予備試験｜個人学習ワークスペース</small></div><button class="pill" id="lock">ロック</button></header>
<main><div class="layout"><aside class="panel"><h3>7科目</h3><div id="subjects"></div><hr style="border-color:#34425a"><p id="count" class="muted"></p><button class="pill" id="export">JSONバックアップ</button><label class="pill" style="cursor:pointer">バックアップを復元<input type="file" id="import" accept=".json" hidden></label></aside><section><div class="panel"><h2 id="title"></h2><p class="muted">分野・論点を選択して学習記録をつけられます。</p><input id="search" placeholder="論点を検索"><div id="topics"></div></div><div class="panel" id="detail"></div></section></div></main>
<script>const subjects=[{"name":"民法","groups":[{"name":"民法総則","topics":["意思表示","代理","無効・取消し","消滅時効","行為能力","信義則・権利濫用","条件・期限"]},{"name":"物権法","topics":["物権的請求権","物権変動","不動産登記","動産物権変動","占有","共有","取得時効","用益物権・相隣関係"]},{"name":"担保物権","topics":["留置権","先取特権・質権","抵当権の効力","抵当権と利用権","共同抵当・根抵当","非典型担保"]},{"name":"債権総論","topics":["債務不履行","損害賠償","債権者代位権","詐害行為取消権","多数当事者","債権譲渡","債務引受","弁済・相殺","その他の消滅原因"]},{"name":"契約法","topics":["契約成立・解釈","双務契約","解除","売買","賃貸借","請負","委任・寄託","その他の契約"]},{"name":"法定債権","topics":["一般不法行為","特殊不法行為","損害賠償の範囲","不当利得","不法原因給付","事務管理"]},{"name":"親族法","topics":["婚姻・取消し","離婚・夫婦財産","親子関係","親権・監護・扶養","養子・後見"]},{"name":"相続法","topics":["相続人・相続分","相続財産・遺産分割","承認・放棄","遺言・遺贈","遺留分","特別受益・寄与分"]}]},{"name":"民事訴訟法","groups":[{"name":"基本原則","topics":["処分権主義","弁論主義"]},{"name":"訴訟主体","topics":["当事者能力","当事者適格","訴訟能力"]},{"name":"裁判所・管轄","topics":["管轄","移送","除斥・忌避"]},{"name":"訴えの提起","topics":["訴訟要件","訴えの利益"]},{"name":"審理と主張","topics":["訴訟物","攻撃防御方法","自白"]},{"name":"証拠・証明","topics":["証明責任","自由心証主義","文書提出命令"]},{"name":"複雑訴訟","topics":["共同訴訟","訴訟参加","訴訟承継"]},{"name":"判決と既判力","topics":["既判力の範囲","遮断効"]},{"name":"訴訟の終了","topics":["訴えの取下げ","訴訟上の和解","請求の放棄・認諾"]},{"name":"上訴・再審","topics":["控訴","上告","再審"]}]},{"name":"刑法","groups":[{"name":"総論","topics":["罪刑法定主義","構成要件","因果関係","故意","錯誤","過失","正当防衛","緊急避難","責任能力","未遂","中止犯","不能犯","共同正犯","教唆・幇助","共犯と身分","罪数"]},{"name":"各論","topics":["殺人","傷害","窃盗","強盗","詐欺","恐喝","横領","背任","放火","文書偽造"]}]},{"name":"刑事訴訟法","groups":[{"name":"捜査","topics":["任意捜査","強制処分","逮捕","勾留","捜索・差押え","令状主義","取調べ","接見交通"]},{"name":"公訴・公判","topics":["公訴提起","訴因","訴因変更"]},{"name":"証拠・裁判","topics":["証拠能力","伝聞法則","違法収集証拠","自白法則","補強法則","証明","裁判","上訴"]}]},{"name":"会社法","groups":[{"name":"会社の基本","topics":["会社の種類","設立"]},{"name":"株式・機関","topics":["株式","株主総会","取締役","取締役会","代表取締役","利益相反取引","取締役の責任","株主代表訴訟","監査役"]},{"name":"組織再編等","topics":["募集株式","新株予約権","組織再編","計算","剰余金配当","解散・清算"]}]},{"name":"憲法","groups":[{"name":"人権","topics":["人権総論","私人間効力","幸福追求権","平等原則","思想良心の自由","信教の自由","政教分離","表現の自由","集会結社の自由","学問の自由","職業選択の自由","財産権","適正手続","生存権","教育を受ける権利","選挙権"]},{"name":"統治","topics":["国会","内閣","司法権","違憲審査制","地方自治"]}]},{"name":"行政法","groups":[{"name":"行政作用","topics":["法律による行政の原理","行政行為","裁量","行政手続","行政指導","行政立法","行政契約","行政上の強制"]},{"name":"行政救済","topics":["行政不服審査","取消訴訟","処分性","原告適格","訴えの利益","出訴期間","違法性の承継","差止訴訟","義務付け訴訟","仮の救済","国家賠償","損失補償"]}]}];const levels=[["基礎理解","制度趣旨、基本用語、条文の構造を説明できる"],["予備短答","要件・効果、原則・例外、判例の結論を区別できる"],["予備論文","問題提起、規範定立、事実の評価、結論を構成できる"],["司法短答","複数論点を横断し、選択肢の正誤を判断できる"],["司法論文","複合事例で争点を抽出し、反論を踏まえた答案を書ける"]];let si=0,ti=0;const $=x=>document.getElementById(x),key="shihou-study-v3-data";let db={};try{db=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const flat=s=>s.groups.flatMap(g=>g.topics.map(t=>({group:g.name,name:t})));const current=()=>si+"-"+ti;const save=()=>localStorage.setItem(key,JSON.stringify(db));function render(){const s=subjects[si],arr=flat(s);$("subjects").innerHTML=subjects.map((x,i)=>'<button class="nav '+(i===si?'active':'')+'" data-si="'+i+'">'+esc(x.name)+'</button>').join("");$("count").textContent=subjects.reduce((n,s)=>n+flat(s).length,0)+"論点を収録";$("title").textContent=s.name;const q=$("search").value.trim();$("topics").innerHTML='<div class="topicgrid" style="margin-top:15px">'+arr.map((x,i)=>({...x,i})).filter(x=>x.name.includes(q)||x.group.includes(q)).map(x=>'<button class="topic '+(ti===x.i?'active':'')+'" data-ti="'+x.i+'"><b>'+esc(x.name)+'</b><br><small>'+esc(x.group)+' · '+Object.keys(db[si+"-"+x.i]?.done||{}).length+'/5</small></button>').join("")+'</div>';detail()}function detail(){const x=flat(subjects[si])[ti],v=db[current()]||{};const lv=levels.map(([name,desc],i)=>i===3&&!["民法","刑法","憲法"].includes(subjects[si].name)?"":'<div class="level"><label><input type="checkbox" data-level="'+i+'" '+(v.done?.[i]?'checked':'')+'> <b>'+name+'</b></label><p>'+desc+'</p></div>').join("");$("detail").innerHTML='<h2>'+esc(x.name)+'</h2><p class="muted">'+esc(x.group)+'</p><div class="notice"><b>教材チェック：未検証</b><br>この画面は学習目標・記録機能です。論点固有の条文・判例・模範答案は原典確認後に追加します。</div><h3>学習レベル</h3><div class="levels">'+lv+'</div><h3>論点ノート</h3><label>条文・判例・論証</label><textarea id="note" placeholder="条文番号・判例・出典を記録">'+esc(v.note||"")+'</textarea><label>過去問ノート</label><textarea id="past" placeholder="試験年度・設問・公式URL・答案構成を記録">'+esc(v.past||"")+'</textarea><p><button class="pill primary" id="save">保存する</button></p><p><a href="https://www.moj.go.jp/jinji/shihoushiken/" target="_blank" rel="noopener">法務省 司法試験関連情報</a></p><p class="muted" id="saved"></p>'} $("subjects").onclick=e=>{const b=e.target.closest("[data-si]");if(b){si=+b.dataset.si;ti=0;$("search").value="";render()}};$("topics").onclick=e=>{const b=e.target.closest("[data-ti]");if(b){ti=+b.dataset.ti;render();$("detail").scrollIntoView({behavior:"smooth"})}};$("search").oninput=render;$("detail").onchange=e=>{if(e.target.dataset.level!==undefined){const v=db[current()]||{};v.done=v.done||{};if(e.target.checked)v.done[e.target.dataset.level]=true;else delete v.done[e.target.dataset.level];db[current()]=v;save();render()}};$("detail").onclick=e=>{if(e.target.id==="save"){db[current()]={...db[current()],note:$("note").value,past:$("past").value};save();$("saved").textContent="保存しました"}};$("export").onclick=()=>{const b=new Blob([JSON.stringify({version:3,data:db},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="shihou-study-backup.json";a.click();URL.revokeObjectURL(a.href)};$("import").onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const o=JSON.parse(await f.text());if(!o.data||typeof o.data!=="object"||Array.isArray(o.data))throw Error();if(confirm("学習データを置き換えますか？")){db=o.data;save();render()}}catch(e){alert("JSONバックアップを確認してください")}};const unlock=()=>{$("gate").classList.add("hidden");sessionStorage.setItem("shihou-unlock","yes")};if(sessionStorage.getItem("shihou-unlock")==="yes")unlock();$("auth").onsubmit=e=>{e.preventDefault();if($("pin").value==="5020")unlock();else{$("error").textContent="暗証番号が違います";$("pin").value=""}};$("lock").onclick=()=>{sessionStorage.removeItem("shihou-unlock");$("gate").classList.remove("hidden");$("pin").value=""};render();</script></body></html>
